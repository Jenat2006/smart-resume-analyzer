{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3 class="text-center">
                    Upload Your Resume
                </h3>

            </div>

            <div class="card-body">

                <form action="/analyze"
                      method="POST"
                      enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">
                            Select Resume (PDF or DOCX)
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            name="resume"
                            accept=".pdf,.docx"
                            required>

                    </div>

                    <div class="d-grid">

                        <button
                            class="btn btn-success btn-lg">

                            Analyze Resume

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
